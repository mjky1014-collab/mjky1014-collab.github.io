<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NEXT CHART Signal Playbook cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080a"/>
      <stop offset=".58" stop-color="#111114"/>
      <stop offset="1" stop-color="#1b1009"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0"/>
      <stop offset=".25" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="110" r="235" fill="#ff6a00" opacity=".12" filter="url(#glow)"/>
  <circle cx="1060" cy="500" r="150" fill="#ffb347" opacity=".08" filter="url(#glow)"/>

  <!-- top meta -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
    <text x="72" y="82" font-size="17" font-weight="700" letter-spacing="5" opacity=".62">2026 NEXT CHART</text>
    <text x="1128" y="82" font-size="15" font-weight="700" letter-spacing="3" text-anchor="end" opacity=".48">SIGNAL PLAYBOOK</text>
  </g>
  <path d="M72 104H1128" stroke="#ffffff" stroke-opacity=".14"/>

  <!-- display type -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-8">
    <text x="66" y="264" font-size="152" fill="#f7f5f2">NEXT</text>
    <text x="66" y="408" font-size="152" fill="url(#orange)">CHART</text>
  </g>
  <text x="76" y="456" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1" fill="#ffffff" opacity=".7">신호등으로 읽는 차트 · GOYA ALGORITHM</text>

  <!-- traffic light -->
  <g transform="translate(1012 196)">
    <rect x="0" y="0" width="92" height="238" rx="46" fill="#151518" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="46" cy="53" r="23" fill="#ff4d4d" opacity=".28"/>
    <circle cx="46" cy="119" r="23" fill="#ffb020" opacity=".28"/>
    <circle cx="46" cy="185" r="25" fill="#20e08a" opacity=".95" filter="url(#glow)"/>
    <circle cx="39" cy="177" r="7" fill="#ffffff" opacity=".38"/>
  </g>

  <!-- mini chart -->
  <g transform="translate(690 460)">
    <path d="M0 62 42 48 84 55 126 30 168 39 210 14 252 23 294 4" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="294" cy="4" r="7" fill="#ff6a00" filter="url(#glow)"/>
    <path d="M0 76H294" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 8"/>
  </g>

  <!-- bottom stats -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" opacity=".56">
    <text x="76" y="560">LIVE SIGNAL</text>
    <text x="238" y="560">SMART CHART</text>
    <text x="430" y="560">2X ISOLATED</text>
    <text x="76" y="590" font-size="12" opacity=".8">3 DATA LAYERS · 6 SCORES · 7 FORMULAS</text>
  </g>
</svg>
