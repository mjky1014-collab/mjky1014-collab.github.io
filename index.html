<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 목록 | MJ</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#070a0f">
<style>
:root{
  --bg:#070a0f;
  --card:#0d1420;
  --card-hover:#101a28;
  --line:#1d2940;
  --line-hover:rgba(0,227,140,.55);
  --txt:#e9eef8;
  --sub:#8493aa;
  --muted:#5f6d84;
  --green:#00e38c;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 70% 45% at 50% -10%,rgba(0,227,140,.09),transparent 65%),
    var(--bg);
  color:var(--txt);
  font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:58px 22px 76px}
.head{display:flex;align-items:center;gap:15px;margin-bottom:38px}
.mark{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--green),#00a869);color:#04140c;
  font-size:16px;font-weight:900;letter-spacing:-.6px;
  box-shadow:0 8px 24px rgba(0,227,140,.22)
}
.head h1{font-size:24px;font-weight:900;letter-spacing:-.9px;line-height:1.2}
.head p{color:var(--sub);font-size:13px;margin-top:3px}
.list{display:flex;flex-direction:column;gap:10px}
.item{
  display:flex;align-items:center;gap:16px;
  padding:17px 19px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  transition:transform .22s,border-color .22s,background .22s
}
.item:hover{transform:translateY(-2px);border-color:var(--line-hover);background:var(--card-hover)}
.item:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.icon{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:21px;background:rgba(0,227,140,.08);border:1px solid rgba(0,227,140,.18)
}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-size:16px;font-weight:800;letter-spacing:-.35px;line-height:1.35}
.cat{font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--green)}
.arrow{flex:none;color:var(--muted);font-size:18px;transition:color .2s,transform .2s}
.item:hover .arrow{color:var(--green);transform:translate(2px,-2px)}
.foot{margin-top:42px;padding-top:18px;border-top:1px solid rgba(29,41,64,.75);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:520px){
  .wrap{padding:40px 16px 60px}
  .head{gap:12px;margin-bottom:28px}
  .mark{width:42px;height:42px;border-radius:12px;font-size:14px}
  .head h1{font-size:21px}
  .head p{font-size:12px}
  .item{padding:14px 15px;gap:12px}
  .icon{width:40px;height:40px;font-size:19px}
  .title{font-size:14.5px}
  .cat{font-size:9.5px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <span class="mark" aria-hidden="true">MJ</span>
    <div>
      <h1>작업 목록</h1>
      <p>내가 만든 페이지만 모아둔 개인 목록</p>
    </div>
  </header>

  <nav class="list" aria-label="작업 목록">
    <a class="item" href="https://mjky1014-collab.github.io/chick/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">🐣</span>
      <span class="body">
        <span class="title">병아리 매매법 · 시바진 어고</span>
        <span class="cat">가이드</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="item" href="https://mjky1014-collab.github.io/top10/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">📈</span>
      <span class="body">
        <span class="title">탑10 급등락 코인 공략</span>
        <span class="cat">가이드</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="item" href="https://mjky1014-collab.github.io/super/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">🚀</span>
      <span class="body">
        <span class="title">수퍼사이클 초보자 가이드</span>
        <span class="cat">가이드</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="item" href="https://mjky1014-collab.github.io/super/memo.html" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">📒</span>
      <span class="body">
        <span class="title">코인노트 통합장부</span>
        <span class="cat">도구</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="item" href="https://mjky1014-collab.github.io/ex/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">🧭</span>
      <span class="body">
        <span class="title">EX 시작 가이드</span>
        <span class="cat">가이드</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="item" href="https://mjky1014-collab.github.io/next/" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">🚦</span>
      <span class="body">
        <span class="title">NEXT CHART 신호등 가이드</span>
        <span class="cat">가이드</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </nav>

  <footer class="foot">
    <span>개인용 작업 목록</span>
    <span>외부에 공유하지 않습니다</span>
  </footer>
</main>
</body>
</html>
